<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport"
					content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet"
					href="./css/normalize.css">
		<link rel="stylesheet"
					href="./css/style._test.css">
		<title>тестируем фишки 2</title>
	</head>

	<body class="page__body">
		<header class="header">
			<nav class="menu header__menu">
				<ul class="menu__list">
					<li class="menu__item">Test1</li>
					<li class="menu__item">Test2</li>
					<li class="menu__item">Test3</li>

							aria-label="Открыть меню"
							aria-expanded="false"

						 height="24">
					<use class="burger__menu-open"
							 href="./icon/sprite.svg#burger-icon" />
					<use class="burger__menu-close"
							 href="./icon/sprite.svg#close-icon" />

			</button>

		Этот макет можно использовать через сниппеты и подстроить под свой код.

	</body>

					src="./js/index_test.js"></script>
