<!DOCTYPE html>
<html lang="ru">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport"
					content="width=device-width, initial-scale=1.0">
		<link rel="preconnect"
					href="https://fonts.googleapis.com">
		<link rel="preconnect"
					href="https://fonts.gstatic.com"
					crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
					rel="stylesheet">
		<link rel="stylesheet"
					href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
		<link rel="stylesheet"
					href="style.css">
		<title>Dashboard</title>
	</head>

	<body>
		<div class="dashboard">
			<header class="dashboard-header">
				<div class="container">
					<div class="dashboard-header__content">
						<div class="dashboard-header__left">
							<div class="dashboard-header__logo"><i class="fas fa-code"></i></div>
							<div class="dashboard-header__info">
								<h1 class="dashboard-header__title">Мои проекты</h1>
								<p class="dashboard-header__subtitle">Panel управления активными проекты</p>
							</div>
						</div>
						<div class="dashboard-header__stats">
							<div class="stat-item">
								<span class="stat-item__value">4</span>
								<span class="stat-item__label">Projects</span>
							</div>
							<div class="stat-item">
								<span class="stat-item__value">4</span>
								<span class="stat-item__label">Active</span>
							</div>
						</div>
					</div>
				</div>
			</header>
			<main class="dashboard-main">
				<div class="container">
					<div class="projects-grid">
						<a href="./Fit-Studio/index.html"
							 class="project-card">
							<div class="project-card__content">
								<div class="project-card__icon-wrapper">
									<div class="project-card__icon fitness">
										<i class="fas fa-dumbbell">
										</i>
									</div>
								</div>
								<div class="project-card__info">
									<h3 class="project-card__title">Fit-Studio</h3>
									<p class="project-card__description">Fitness website</p>
									<div class="project-card__meta"><span class="project-card__tag project-card__tag--green">Active</span>
									</div>
								</div>
								<div class="project-card__arrow"><i class="fas fa-arrow-right"></i></div>
							</div>
						</a>
						<a href="./Nike/index.html"
							 class="project-card">
							<div class="project-card__content">
								<div class="project-card__icon-wrapper">
									<div class="project-card__icon nike"><i class="fas fa-shoe-prints"></i></div>
								</div>
								<div class="project-card__info">
									<h3 class="project-card__title">Nike</h3>
									<p class="project-card__description">Nike catalog</p>
									<div class="project-card__meta">
										<span class="project-card__tag project-card__tag--green">
											Active
										</span>
									</div>
								</div>
								<div class="project-card__arrow"><i class="fas fa-arrow-right"></i></div>
							</div>
						</a>
						<a href="./diploma/layout/index.html"
							 class="project-card">
							<div class="project-card__content">
								<div class="project-card__icon-wrapper">
									<div class="project-card__icon diploma"><i class="fas fa-graduation-cap"></i></div>
								</div>
								<div class="project-card__info">
									<h3 class="project-card__title">Diploma</h3>
									<p class="project-card__description">Diploma project</p>
									<div class="project-card__meta">
										<span class="project-card__tag project-card__tag--green">
											Active</span>
									</div>
								</div>
								<div class="project-card__arrow"><i class="fas fa-arrow-right"></i></div>
							</div>
						</a>
						<a href="./test/index.html"
							 class="project-card">
							<div class="project-card__content">
								<div class="project-card__icon-wrapper">
									<div class="project-card__icon test"><i class="fas fa-vial"></i></div>
								</div>
								<div class="project-card__info">
									<h3 class="project-card__title">Test</h3>
									<p class="project-card__description">Test project</p>
									<div class="project-card__meta"><span class="project-card__tag project-card__tag--blue">Test</span>
									</div>
								</div>
								<div class="project-card__arrow"><i class="fas fa-arrow-right"></i></div>
							</div>
						</a>
					</div>
				</div>
			</main>
			<footer class="dashboard-footer">
				<div class="container">
					<p>2026 Projects</p>
				</div>
			</footer>
		</div>
	</body>

</html>
